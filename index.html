<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Signup Form</title>
  </head>
  <body>
    <div class="aside">
      <div class="aside__logo">
        <img src="./assets/odin-lined.png" />
        <h1 class="logo-text">Odin</h1>
      </div>
      <p class="aside__credits">
        Photo by
        <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on
        <a href="https://unsplash.com/">Unsplash</a>
      </p>
    </div>

    <div class="form-container">
      <section class="cta">
        <p class="cta__text">
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. Sign up
          <em>now</em>
          to get started.
        </p>
        <p>You <em>know</em> you want to.</p>
      </section>
      <form action="/" method="post">
        <fieldset>
          <p>Let's do this!</p>
          <section class="name">
            <p class="form__input">
              <label for="first-name">First Name</label>
              <input type="text" name="first-name" id="fname" />
            </p>
            <p class="form__input">
              <label for="last-name">Last Name</label>
              <input type="text" name="last-name" id="lname" />
            </p>
          </section>

          <section class="contact">
            <p class="form__input">
              <label for="email">Email</label>
              <input type="email" name="email" id="email" />
            </p>
            <p class="form__input">
              <label for="telephone">Phone Number</label>
              <input type="tel" name="telephone" id="tel" />
            </p>
          </section>

          <section class="password">
            <p class="form__input">
              <label for="password">Password</label>
              <input type="password" name="password" id="pass" />
            </p>
            <p class="form__input">
              <label for="confirm-password">Confirm Password</label>
              <input type="password" name="confirm-password" id="conf-pass" />
            </p>
          </section>
        </fieldset>
        <p class="button">
          <button type="submit">Create Account</button>
        </p>
        <p class="form__login">
          Already have an account? <a href="">Log In</a>
        </p>
      </form>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
